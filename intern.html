<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
        }

        .calculator {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        #display {
            width: 95%;
            height: 50px;
            background-color: yellow;
            border: none;
            text-align: right;
            font-size: 20px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: lightblue;
        }

        button.operator {
            background-color: #ffb74d;
        }

        button.equal {
            background-color: #4caf50;
            color: white;
            grid-column: span 2;
        }

        button.clear {
            background-color: #f44336;
            color: white;
            grid-column: span 2;
        }

        button.delete {
            background-color: #f44336;
            color: white;
        }
            
    </style>
</head>
<body>

<div class="calculator" style="background-color: black;">
    <h1 style="color:white;">BASIC CALCULATOR</h1>

    <input type="text" id="display" disabled>

    <div class="buttons">
        <button class="clear">C</button>
        <button class="delete">DEL</button>
        <button class="operator">*</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">-</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">+</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">/</button>

        <button>0</button>
        <button>.</button>
        <button class="equal">=</button>

    </div>
</div>

<script>
    const display = document.getElementById("display");
    const buttons = document.querySelectorAll("button");

    let currentInput = "";

    // Loop through all buttons
    for (let i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener("click", function () {
            let value = this.textContent;

            if (value === "C") {
                currentInput = "";
                display.value = "";
            }
            else if (value === "DEL") {
                // Remove last character
                currentInput = currentInput.slice(0, -1);
                display.value = currentInput;
            }
            else if (value === "=") {
                try {
                    let result = eval(currentInput);
                    display.value = "ANS : " + result;
                    currentInput = result.toString();
                } catch {
                    display.value = "Error";
                    currentInput = "";
                }
            }
            else {
                currentInput += value;
                display.value = currentInput;
            }
        });
    }
</script>

</body>
</html>
